name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

# Node 20 sur les runners GitHub est déprécié (forcé en Node 24 le 2026-06-02,
# retiré le 2026-09-16). checkout/setup-node passent en v5 (runtime Node 24
# natif) ; peaceiris/actions-gh-pages n'a pas de release Node 24 (toujours v4) →
# on le force en Node 24 via cette variable (mécanisme officiel GitHub).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # §350 — garde-fou React #310 : `react-hooks/rules-of-hooks` en ERREUR.
      # Une vraie violation bloque le déploiement (les warnings ne bloquent pas).
      - name: Lint (react-hooks)
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
